{% extends "base.html" %}
{% block title %}Мозаика — VHS-Security{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mosaic.css') }}">
<div class="mosaic-page">
  <div class="mosaic-head">
    <div>
      <div class="kicker">Видеонаблюдение</div>
      <h1>Мозаика камер</h1>
    </div>
    <div class="mosaic-controls">
      <label>Группировка
        <select id="mosaicGroup">
          <option value="building">По объектам</option>
          <option value="floor">Объект → этажи</option>
          <option value="guard">Объект → охрана</option>
        </select>
      </label>
      <button type="button" class="ghost" id="mosaicRefresh">Обновить</button>
      <a class="button" href="{{ url_for('index') }}">← На карту</a>
    </div>
  </div>

  <div class="mosaic-tabs" id="mosaicGroupTabs"></div>
  <div class="mosaic-tabs mosaic-subtabs" id="mosaicDetailTabs" hidden></div>

  <div class="mosaic-topline">
    <div class="mosaic-pager" id="mosaicPager"></div>
    <div class="mosaic-status" id="mosaicStatus">Загрузка камер…</div>
    <div class="mosaic-legend"><span><i class="dot red"></i> событие</span><span><i class="dot green"></i> на охране</span><span><i class="dot gray"></i> снята</span></div>
  </div>

  <div class="mosaic-stage">
    <div id="mosaicGroups"></div>
  </div>
</div>

<div class="mosaic-fs" id="mosaicFullscreen">
  <div class="mosaic-fs-bar">
    <b id="mosaicFsTitle"></b>
    <div style="display:flex;gap:7px;align-items:center">
      <button type="button" class="mosaic-fs-ptz" id="mosaicFsPtz" hidden>PTZ</button>
      <button type="button" id="mosaicFsClose" title="Закрыть (Esc)">✕</button>
    </div>
  </div>
  <div class="mosaic-fs-body">
    <video id="mosaicFsVideo" autoplay muted playsinline></video>
    <div class="mosaic-fs-error" id="mosaicFsError" hidden></div>
    <div class="mosaic-fs-ptz-panel" id="mosaicFsPtzPanel" hidden>
      <div class="mosaic-fs-ptz-head">
        <b>PTZ</b>
        <button type="button" id="mosaicFsPtzClose" title="Скрыть панель">✕</button>
      </div>
      <div class="mosaic-fs-ptz-grid">
        <button type="button" data-fsptz-move="-1,1">↖</button>
        <button type="button" data-fsptz-move="0,1">↑</button>
        <button type="button" data-fsptz-move="1,1">↗</button>
        <button type="button" data-fsptz-move="-1,0">←</button>
        <button type="button" data-fsptz-home>⌂</button>
        <button type="button" data-fsptz-move="1,0">→</button>
        <button type="button" data-fsptz-move="-1,-1">↙</button>
        <button type="button" data-fsptz-move="0,-1">↓</button>
        <button type="button" data-fsptz-move="1,-1">↘</button>
      </div>
      <div class="mosaic-fs-ptz-zoom">
        <button type="button" data-fsptz-zoom="1">＋</button>
        <button type="button" data-fsptz-zoom="-1">−</button>
      </div>
      <button type="button" class="mosaic-fs-ptz-invert" id="mosaicFsPtzInvert">Инверсия: выкл</button>
      <button type="button" class="mosaic-fs-ptz-stop" id="mosaicFsPtzStop">Стоп</button>
      <div class="mosaic-fs-ptz-status" id="mosaicFsPtzStatus"></div>
    </div>
  </div>
</div>

<div class="mosaic-ptz-overlay" id="mosaicPtzOverlay">
  <div class="mosaic-ptz-card">
    <div class="mosaic-ptz-head">
      <b id="mosaicPtzTitle">PTZ</b>
      <button type="button" id="mosaicPtzClose">✕</button>
    </div>
    <div class="mosaic-ptz-grid">
      <button type="button" data-mptz-move="-1,1">↖</button>
      <button type="button" data-mptz-move="0,1">↑</button>
      <button type="button" data-mptz-move="1,1">↗</button>
      <button type="button" data-mptz-move="-1,0">←</button>
      <button type="button" data-mptz-home>⌂</button>
      <button type="button" data-mptz-move="1,0">→</button>
      <button type="button" data-mptz-move="-1,-1">↙</button>
      <button type="button" data-mptz-move="0,-1">↓</button>
      <button type="button" data-mptz-move="1,-1">↘</button>
    </div>
    <div class="mosaic-ptz-zoom">
      <button type="button" data-mptz-zoom="1">＋</button>
      <button type="button" data-mptz-zoom="-1">−</button>
    </div>
    <button type="button" class="mosaic-ptz-invert" id="mosaicPtzInvert">Инверсия: выкл</button>
    <button type="button" class="mosaic-ptz-stop" id="mosaicPtzStop">Стоп</button>
    <div class="mosaic-ptz-status" id="mosaicPtzStatus"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/whep-player.js') }}"></script>
<script src="{{ url_for('static', filename='js/mosaic.js') }}?v=7"></script>
{% endblock %}
